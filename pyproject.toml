[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "land-classification"
version = "0.1.0"
description = "Land-use classification benchmark on EuroSAT-RGB: hand-crafted features vs ResNet-18, with explainability and figure outputs."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Gustavo Scholze" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "xgboost>=2.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "shap>=0.45",
    "PyYAML>=6.0",
    "certifi>=2024.2.2",
    "tqdm>=4.66",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/land_classification"]

[tool.uv]
package = true

# CUDA 12.8 wheels on Windows/Linux (PyPI's Windows wheels are CPU-only). macOS uses PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
